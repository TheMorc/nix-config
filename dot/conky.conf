conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = false,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    --font = 'monospace-8',
    gap_x = 30,
    gap_y = 30,
    minimum_height = 5,
    minimum_width = 8,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 30,
    uppercase = false,
    use_spacer = 'none',
    use_xft = false,
}

conky.text = [[
${color grey}$color Mac mini Server | ${exec . /etc/os-release && printf "%s %s\n" "$NAME" "$VERSION"}
$hr
${color grey}Linux aarch64-$kernel
${color grey}Uptime:$color $uptime
${color grey}Icestorm-M1:$color ${freq 1} MHz
${exec CPUpercent 0}

${color grey}Firestorm-M1:$color ${freq 5} MHz
${exec CPUpercent 4}
${color grey}CPU Usage:$color $cpu% ${cpubar 4}
${color grey}RAM Usage:$color $mem/$memmax - $memperc% ${membar 4}
${color grey}Swap Usage:$color $swap/$swapmax - $swapperc% ${swapbar 4}
${color grey}Apple Fabric SSD: $color${fs_used /}/${fs_size /} ${fs_bar 6 /}
${color grey}mini Enterprise: $color${fs_used /mini_enterprise}/${fs_size /mini_enterprise} ${fs_bar 6 /mini_enterprise}
$hr
${color grey}Nginx Web Server:$color${if_match "${exec systemctl is-active nginx.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}Samba:$color${if_match "${exec systemctl is-active samba-smbd.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}IRC @ 370network:$color${if_match "${exec systemctl is-active ircServiceWorker.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}370network Service Worker:$color${if_match "${exec systemctl is-active threeseventyServiceWorker.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}Kiosk XRDP:$color${if_match "${exec systemctl is-active xrdp.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}View-only VNC:$color${if_match "${exec systemctl --user is-active vnc_ro.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}Cockpit:$color${if_match "${exec systemctl is-active cockpit.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}Home Assistant:$color${if_match "${exec systemctl is-active home-assistant.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}TVheadend:$color${if_match "${exec systemctl is-active tvheadend.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}Immich:$color${if_match "${exec  systemctl is-active immich-server.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}Transmission BitTorrent Service:$color${if_match "${exec systemctl is-active transmission.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}Vaultwarden:$color${if_match "${exec systemctl is-active vaultwarden.service}" == "active"} Running ${else} Stopped ${endif}
${color grey}Jellyfin:$color${if_match "${exec systemctl is-active jellyfin.service}" == "active"} Running ${else} Stopped ${endif}
$hr
${color grey}Processes:$color $processes  ${color grey}Running:$color $running_processes
Name               PID      CPU%   MEM%
${color lightgrey} ${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1}
